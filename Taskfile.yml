version: "3"

tasks:
  install:
    desc: Install the locked dependencies
    cmds:
      - npm ci

  format:check:
    desc: Check source formatting
    cmds:
      - npm run format:check

  lint:
    desc: Lint source and tests
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check source and tests
    cmds:
      - npm run typecheck

  test:
    desc: Run the unit test suite
    cmds:
      - npm test

  build:
    desc: Build the package
    run: once
    cmds:
      - npm run build

  test:stdio:
    desc: Verify MCP metadata over the built stdio transport
    deps:
      - build
    cmds:
      - node scripts/e2e/stdio-metadata-integration.mjs

  test:package:
    desc: Verify the npm dry-run metadata and packed tarball contract
    deps:
      - build
    cmds:
      - node scripts/e2e/package-metadata-integration.mjs

  verify:live:
    desc: Verify the real MCP to Claude Agent SDK path with local Claude authentication
    deps:
      - build
    cmds:
      - node scripts/e2e/live-agent-sdk.mjs

  verify:codex:
    desc: Verify Codex delegation through the packaged skill and stdio MCP server
    deps:
      - build
    cmds:
      - node scripts/e2e/codex-delegation.mjs

  ci:
    desc: Run the complete local and CI quality gate
    cmds:
      - task: install
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test
      - task: test:stdio
      - task: test:package

  pre-commit:
    desc: Check staged files, types, and tests
    cmds:
      - npx --no-install lint-staged
      - task: typecheck
      - task: test
